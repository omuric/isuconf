[package]
name = "isuconf"
version = "0.2.6"
edition = "2024"
rust-version = "1.99"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "2"
cap-std = "4"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
itertools = "0.15"
tokio = { version = "1", features = ["full"] }
openssh = "0.11"
colored = "3"
parse-size = "1"

[dev-dependencies]
tempfile = "3"
